[package]
name = "l123-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Lotus 1-2-3 R3 (.WK3) read support.
#
# `ironcalc_lotus` is NOT on crates.io and NOT in the upstream
# https://github.com/ironcalc/ironcalc repository — it currently
# lives only in a local IronCalc fork at `../../../IronCalc/lotus`
# (i.e. a sibling checkout of this repo's parent dir).
#
# On this branch the `ironcalc_lotus` dep below is already uncommented
# (that is what separates it from `master`), so WK3 support only needs:
#   1. A checkout of the IronCalc fork's `lotus_file_support_0.8`
#      branch at `../IronCalc`, so `../IronCalc/lotus` exists
#      alongside this repo.
#   2. `--features wk3` (or `--features l123/wk3` for the binary).
#
# Plain `cargo build` therefore requires that clone on disk here; use
# `master` for the public-clean build that does not.
wk3 = []

[dependencies]
l123-core = { workspace = true }
ironcalc_xlsx = { workspace = true }
# Uncommented on this branch by design — see [features] above.
ironcalc_lotus = { path = "../../../IronCalc/lotus" }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `zip` is used by the `build_fixtures` example to hand-patch xlsx
# files with features IronCalc's exporter doesn't emit (e.g. sheet
# tabColor — see docs/XLSX_IMPORT_PLAN.md §2.6 notes on upstream gap).
# Version pinned to match IronCalc's transitive `zip` so we aren't
# compiling two versions.
zip = "0.6"
